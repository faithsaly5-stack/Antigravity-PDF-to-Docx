[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-to-docx-studio"
version = "1.0.0"
description = "Advanced Markdown to DOCX & PDF Converter Engine with RTL/Persian Typography & Academic Formatting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Markdown Studio Team"}
]
dependencies = [
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    "PyYAML>=6.0",
    "Pygments>=2.17.0",
    "latex2mathml>=3.77.0",
    "lxml>=5.1.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "customtkinter>=5.2.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
pdf = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
md2docx = "md2docx.cli:main"
md2docx-gui = "md2docx.gui:launch_gui"

[tool.setuptools.packages.find]
include = ["md2docx*"]

[tool.setuptools.package-data]
"*" = ["assets/*", "templates/*"]
